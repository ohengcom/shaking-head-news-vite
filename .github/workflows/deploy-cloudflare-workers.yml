name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_VERSION: '11.11.1'

jobs:
  deploy:
    name: Deploy (Vite -> Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_URL: https://sn.oheng.com
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_ID }}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET }}
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_TENANT_ID }}
      NEWS_API_BASE_URL: ${{ secrets.NEWS_API_BASE_URL }}
      VITE_LOG_LEVEL: ${{ secrets.VITE_LOG_LEVEL }}
      VITE_ADSENSE_CLIENT_ID: ${{ secrets.VITE_ADSENSE_CLIENT_ID }}
      VITE_ADSENSE_SLOT_SIDEBAR: ${{ secrets.VITE_ADSENSE_SLOT_SIDEBAR }}
      VITE_ADSENSE_SLOT_HEADER: ${{ secrets.VITE_ADSENSE_SLOT_HEADER }}
      VITE_ADSENSE_SLOT_FOOTER: ${{ secrets.VITE_ADSENSE_SLOT_FOOTER }}
      VITE_ADSENSE_SLOT_INLINE: ${{ secrets.VITE_ADSENSE_SLOT_INLINE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Validate required Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$BETTER_AUTH_URL" ]; then
            echo "Missing secret: BETTER_AUTH_URL"
            exit 1
          fi
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "Missing secret: BETTER_AUTH_SECRET"
            exit 1
          fi

          if [ -z "$VITE_ADSENSE_CLIENT_ID" ]; then
            echo "Warning: VITE_ADSENSE_CLIENT_ID is empty; build will fall back to the default publisher id"
          fi

          if [ -z "$VITE_ADSENSE_SLOT_SIDEBAR" ] && \
             [ -z "$VITE_ADSENSE_SLOT_HEADER" ] && \
             [ -z "$VITE_ADSENSE_SLOT_FOOTER" ] && \
             [ -z "$VITE_ADSENSE_SLOT_INLINE" ]; then
            echo "Warning: all VITE_ADSENSE_SLOT_* secrets are empty; ad slots will remain disabled until configured"
          fi

      - name: Validate and build Vite output
        run: |
          set -euo pipefail
          set +e
          build_output="$(npm run check 2>&1)"
          build_code=$?
          set -e

          if [ "$build_code" -ne 0 ]; then
            echo "$build_output"
            build_snippet="$(printf '%s\n' "$build_output" | head -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Validation/build failed::$build_snippet"
            exit "$build_code"
          fi

          echo "$build_output"

      - name: Deploy to Cloudflare Workers
        run: |
          set -euo pipefail

          # First apply any pending Durable Object migrations via `wrangler deploy`.
          # Cloudflare requires migrations to be deployed directly rather than via
          # `wrangler versions upload`.
          npx wrangler deploy

          # Then sync runtime secrets if configured
          if [ -n "$BETTER_AUTH_SECRET" ]; then
            echo "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET
          fi
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            echo "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          fi
          if [ -n "$AUTH_MICROSOFT_ENTRA_ID_SECRET" ]; then
            echo "$AUTH_MICROSOFT_ENTRA_ID_SECRET" | npx wrangler secret put AUTH_MICROSOFT_ENTRA_ID_SECRET
          fi
